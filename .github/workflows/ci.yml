name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository, and no job reads a secret. The
# database job runs entirely against a disposable local stack on the runner:
# no linked project, no production credentials, no service-role key.
permissions:
  contents: read

jobs:
  # Job 1: Your original Frontend, Lint, and Unit Checks
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

  # Job 2: Our new Supabase & pgTAP Security Tester
  test-database:
    name: Run pgTAP Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned, not `latest`. A CLI release can change how migrations apply
          # or how results are reported, and a verification gate whose toolchain
          # moves on its own is not repeatable. Matches the `supabase`
          # devDependency in package.json.
          version: 2.111.0

      - name: Start disposable Supabase stack
        shell: bash
        run: |
          set -o pipefail

          # `supabase start` prints the local API URL together with the local
          # anon and service-role JWTs. They are the fixed local-development
          # keys rather than project secrets, but they do not belong in a build
          # log, so the output is captured and only a sanitised copy is shown
          # if the step fails.
          status=0
          supabase start > supabase-start.log 2>&1 || status=$?

          if [ "$status" -ne 0 ]; then
            echo "::error::supabase start failed (exit $status); sanitised output follows"
            sed -E \
              -e 's/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/[REDACTED_JWT]/g' \
              -e 's#(postgres(ql)?://[^:@]+:)[^@]+@#\1[REDACTED]@#g' \
              -e 's/(([Kk]ey|[Ss]ecret|[Pp]assword|[Tt]oken)[[:space:]]*[:=][[:space:]]*)[^[:space:]]+/\1[REDACTED]/g' \
              supabase-start.log
            exit "$status"
          fi

          echo "Local stack started."

      - name: Apply migrations from zero
        shell: bash
        run: |
          set -o pipefail

          # A separate step from the tests on purpose: a migration that cannot
          # apply and a test that fails are different diagnoses, and this one
          # should not be buried inside stack startup.
          #
          # The suites build their own fixtures inside a transaction they roll
          # back, so no seed data is required. supabase/seed.sql does not exist;
          # skipping seeding explicitly avoids depending on how a missing file
          # referenced by config.toml happens to be treated.
          # The help text is captured before it is searched rather than piped
          # into `grep -q`. Under `pipefail` that pipeline reports failure even
          # when the flag is present: grep exits at the first match, the CLI
          # writes into a closed pipe, and its SIGPIPE status (141) becomes the
          # status of the whole pipeline. The first run of this job took the
          # fallback branch for exactly that reason.
          reset_help=$(supabase db reset --help 2>&1 || true)
          case "$reset_help" in
            *--no-seed*)
              supabase db reset --local --no-seed
              ;;
            *)
              echo "note: this CLI offers no --no-seed flag; resetting with seeding enabled"
              supabase db reset --local
              ;;
          esac

      - name: INTENTIONAL TENANT-ISOLATION REGRESSION (proof branch only)
        shell: bash
        run: |
          set -o pipefail

          echo "::warning::Applying an intentional RLS regression to the disposable CI database. This branch exists to prove the gate fails, and must never be merged."

          # The container, not a connection string: a URL carrying
          # postgres:postgres would be a credential-bearing string in the log,
          # which this workflow's start step goes to some trouble to avoid.
          container=$(docker ps --filter "name=supabase_db" --format '{{.Names}}' | head -n1)
          if [ -z "$container" ]; then
            echo "::error::no supabase_db container found"
            exit 1
          fi
          echo "applying fixture to $container"

          docker exec -i "$container" psql -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f - \
            < supabase/tests/proof/intentional_daily_sales_rls_regression.sql

          # Confirm the fixture took effect. A no-op fixture would produce a
          # green run that looks like proof of a working guard, which is the
          # opposite of what this branch is for.
          predicate=$(docker exec -i "$container" psql -U postgres -d postgres -Atc \
            "select pg_get_expr(polqual, polrelid) from pg_policy where polname = 'daily_sales_select_member'")
          echo "daily_sales_select_member USING predicate is now: $predicate"
          if [ "$predicate" != "true" ]; then
            echo "::error::fixture did not take effect; the red run below would not prove anything"
            exit 1
          fi

      - name: Run database test suites
        shell: bash
        run: |
          set -o pipefail

          # A pre-run expectation counted from source. It is an approximation
          # and is reported only for comparison -- the observed count below is
          # the evidence, and a difference between the two is never on its own
          # a reason to pass or fail.
          expected=$(cat supabase/tests/database/*.test.sql \
            | grep -E '^select[[:space:]]+[a-z_]+\(' \
            | grep -vc 'no_plan' || true)

          status=0
          supabase test db --local 2>&1 | tee pgtap-output.log || status=$?

          # pg_prove's summary line carries the total. If a future CLI reports
          # verbose TAP instead, fall back to counting the assertion lines
          # themselves. If neither yields a number the job fails: an unreported
          # count must never be mistaken for a passing one.
          observed=$(grep -Eo 'Tests=[0-9]+' pgtap-output.log | tail -n1 | cut -d= -f2 || true)
          if [ -z "$observed" ]; then
            observed=$(grep -Ec '^(ok|not ok) [0-9]+' pgtap-output.log || true)
            if [ "$observed" = "0" ]; then
              observed=""
            fi
          fi

          suites=$(grep -Eo '[A-Za-z0-9_]+\.test\.sql' pgtap-output.log | sort -u || true)
          executed=$(printf '%s\n' "$suites" | grep -c . || true)
          in_repo=$(ls supabase/tests/database/*.test.sql | wc -l)

          # Every reason this job may fail is decided before the summary is
          # written, so what the summary reports is what actually happened.
          reason=""
          if [ "$status" -ne 0 ]; then
            reason="database tests failed (exit $status)"
          elif grep -Eq '^not ok ' pgtap-output.log; then
            # Belt and braces: a harness that reported failing assertions but
            # exited zero must not pass this gate.
            reason="output contains failing assertions despite a zero exit code"
          elif [ -z "$observed" ]; then
            # An unreported count must never be mistaken for a passing one.
            reason="no executed assertion count could be parsed from the test output"
          elif [ "$executed" -ne "$in_repo" ]; then
            reason="executed $executed suites but the repository holds $in_repo"
          fi

          if [ -n "$reason" ]; then result="FAIL -- $reason"; else result="pass"; fi

          {
            echo "## Database verification"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Environment | disposable Supabase local stack on the runner |"
            echo "| Supabase CLI | 2.111.0 (pinned) |"
            echo "| Migrations | applied from zero before the suites ran |"
            echo "| Suites in repository | $in_repo |"
            echo "| Suites executed | $executed |"
            echo "| Expected count before execution (static source estimate, not evidence) | $expected |"
            echo "| Observed count in CI (parsed from execution output) | ${observed:-unparsed} |"
            echo "| Result | $result |"
            echo
            echo "### Suites executed"
            echo '```'
            printf '%s\n' "$suites"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$reason" ]; then
            echo "::error::$reason"
            # The test command's own exit code is preserved where it had one,
            # so a failure is not flattened by having been piped through tee.
            if [ "$status" -ne 0 ]; then exit "$status"; fi
            exit 1
          fi

          echo "Observed $observed assertions across $executed suites (expected about $expected)."

      - name: Upload database test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgtap-output
          path: pgtap-output.log
          if-no-files-found: warn

      - name: Stop Supabase Stack
        if: always()
        run: supabase stop
